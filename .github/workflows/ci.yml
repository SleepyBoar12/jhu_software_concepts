name: Module 5 CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash
        working-directory: module_5

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/test_db

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          dot -V

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      # Check 1
      - name: Pylint — require 10 out of 10
        if: ${{ !cancelled() }}
        run: python -m pylint --fail-under=10 src

      # Check 2
      - name: Generate and verify dependency graph
        if: ${{ !cancelled() }}
        run: |
          rm -f dependency.svg
          pydeps src --noshow -T svg -o dependency.svg \
            --reverse --max-bacon 0 --log ERROR \
            --only module_5.src module_2 \
            --rmprefix module_5.src.
          test -s dependency.svg

      # Check 3
      - name: Snyk dependency scan
        if: ${{ !cancelled() }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::SNYK_TOKEN is unavailable. Configure the Actions secret."
            exit 1
          fi
          snyk test --file=requirements.txt --command=python

      # Check 4
      - name: Pytest — require passing tests and 100% coverage
        if: ${{ !cancelled() }}
        run: python -m pytest tests --require-postgres

      - name: Upload dependency graph
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: module-5-dependency-graph
          path: module_5/dependency.svg
          if-no-files-found: error