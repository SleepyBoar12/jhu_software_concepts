name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "module_4/**"
      - "module_2/scrape.py"
      - "module_2/clean.py"
      - ".github/workflows/documentation.yml"
      - ".readthedocs.yaml"
  pull_request:
    paths:
      - "module_4/**"
      - "module_2/scrape.py"
      - "module_2/clean.py"
      - ".github/workflows/documentation.yml"
      - ".readthedocs.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r module_4/requirements.txt

      - name: Build Sphinx documentation
        run: python -m sphinx -b html -W --keep-going module_4/docs module_4/docs/_build/html
